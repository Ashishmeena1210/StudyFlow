version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: studyflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: studyflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studyflow-backend
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/studyflow?schema=public"
      PORT: 5000
      NODE_ENV: "production"
      JWT_SECRET: "studyflow-prod-jwt-secret-key-replace-in-env"
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "*"
      AI_API_KEY: "${AI_API_KEY}"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studyflow-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
