services:
  # 1. Express Backend Web Service
  - type: web
    name: studyflow-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: studyflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://study-flow-weld.vercel.app
      - key: CORS_ORIGIN
        value: https://study-flow-weld.vercel.app
      - key: AI_API_KEY
        sync: false

  # 2. Vite Frontend Web App (Static Site with SPA Routing)
  - type: web
    name: studyflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://studyflow-1-appz.onrender.com/api/v1

databases:
  # 3. PostgreSQL Managed Database
  - name: studyflow-db
    databaseName: studyflow
    user: studyflow_user
    plan: free
